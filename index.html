<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Arte Equilíbrio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- Google Fonts: Outfit (Premium e Altamente Legível) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #25D366;
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --text-main: #2c3e50;
            --card-bg: #ffffff;
            --input-padding: 14px 18px;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            background: var(--bg-gradient); 
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 650px; /* Aumentado para melhor leitura no iPad */
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0, 51, 102, 0.1); 
            padding: 40px 30px; 
            border-top: 8px solid var(--primary-color);
        }

        .titulo { text-align: center; margin-bottom: 30px; }
        .titulo h1 { font-size: 2rem; color: var(--primary-color); margin-bottom: 8px; font-weight: 600; }
        .titulo p { font-size: 1.1rem; color: #666; }

        form { display: flex; flex-direction: column; gap: 20px; }
        
        label { 
            font-size: 1.05rem; 
            color: var(--primary-color); 
            margin-bottom: 6px; 
            display: block; 
            font-weight: 600;
        }

        input, select, textarea { 
            width: 100%; 
            padding: var(--input-padding); 
            border-radius: var(--border-radius); 
            border: 2px solid #e0e0e0; 
            font-size: 1.15rem; /* Aumentado para leitura matinal */
            transition: all 0.2s;
            background-color: #fcfcfc;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.1); 
            background-color: #fff;
        }

        /* Estilo para Radio Buttons Maiores */
        .radio-group { 
            display: flex; 
            gap: 24px; 
            margin-top: 10px; 
            background: #f8f9fa;
            padding: 15px;
            border-radius: var(--border-radius);
        }
        .radio-group label { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.1rem; 
            cursor: pointer;
            margin-bottom: 0;
        }
        .radio-group input[type="radio"] { 
            width: 22px; 
            height: 22px; 
            accent-color: var(--primary-color);
        }

        button[type="submit"] { 
            margin-top: 15px; 
            padding: 18px 24px; 
            border-radius: 50px; 
            border: none; 
            background: var(--primary-color); 
            color: #fff; 
            font-size: 1.3rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
        }

        button[type="submit"]:hover { filter: brightness(1.2); transform: translateY(-2px); }
        button[type="submit"]:active { transform: translateY(0); }

        .linha { display: flex; gap: 20px; }
        .linha > div { flex: 1; }

        .spinner { 
            border: 3px solid rgba(255,255,255,0.3); 
            border-top: 3px solid #fff; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            animation: spin 0.8s linear infinite; 
            display: none; 
        }

        #cpf-spinner { border-top-color: var(--primary-color); border-color: #eee; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .mensagem { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            padding: 20px 30px; 
            border-radius: var(--border-radius); 
            font-size: 1.1rem; 
            z-index: 1000; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .mensagem.sucesso { background: var(--accent-color); color: white; }
        .mensagem.erro { background: #e74c3c; color: white; }

        @media (max-width: 600px) {
            .card { padding: 30px 20px; border-radius: 0; }
            .linha { flex-direction: column; gap: 15px; }
            .titulo h1 { font-size: 1.6rem; }
            body { padding: 0; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="titulo">
            <h1>Agenda Arte Equilíbrio</h1>
            <p>Agendamento rápido e seguro em tempo real.</p>
        </div>
        <form id="form-agendamento">
            <div>
                <label for="dataAgendamento">📅 Data do Agendamento</label>
                <select id="dataAgendamento" name="dataAgendamento" required>
                    <option value="">Carregando datas disponíveis...</option>
                </select>
            </div>

            <div class="linha">
                <div style="position: relative;">
                    <label for="cpf">🆔 CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    <div style="position: absolute; right: 15px; top: 55px;"><div class="spinner" id="cpf-spinner"></div></div>
                </div>
                <div>
                    <label for="celular">📱 Celular (WhatsApp)</label>
                    <input type="tel" id="celular" name="celular" placeholder="(11) 99999-9999">
                </div>
            </div>

            <div>
                <label for="nome">👤 Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="radio-group">
                <label><input type="radio" name="tipoCliente" value="empresa"> 🏢 Empresa</label>
                <label><input type="radio" name="tipoCliente" value="particular"> 👤 Particular</label>
            </div>

            <div class="linha">
                <div>
                    <label for="tipo">📋 Tipo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="VIG">VIG (Vigilante)</option>
                        <option value="PF">PF (Polícia Federal)</option>
                        <option value="Psicossocial">Psicossocial</option>
                    </select>
                </div>
                <div>
                    <label for="curso">🎓 Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione o tipo primeiro</option>
                    </select>
                </div>
            </div>

            <div id="wrapper-empresa">
                <label for="empresa" id="label-empresa">🏢 Nome da Empresa / Academia / Clube de Tiro / Despachante</label>
                <input type="text" id="empresa" name="empresa">
            </div>

            <div>
                <label for="obs">📝 Observações Adicionais</label>
                <textarea id="obs" name="obs" rows="3" placeholder="Ex: Informações relevantes para a empresa..."></textarea>
            </div>

            <input type="hidden" id="nascimento" name="nascimento">
            <input type="hidden" id="sexo" name="sexo">

            <button type="submit" id="btn-enviar">
                <span id="btn-texto">Confirmar Agendamento</span>
                <div class="spinner" id="btn-spinner"></div>
            </button>
        </form>
    </div>

    <script>
        // CONFIGURAÇÕES DE API (SEGURANÇA ATIVADA)
        // Agora o Token está escondido no n8n.
        const CPF_PROXY_URL = 'https://webhook.arte7.cloud/webhook/cpf-consult-proxy';
        const N8N_WEBHOOK_URL = 'https://webhook.arte7.cloud/webhook/agendamentoweb';
        const DATAS_WEBHOOK_URL = 'https://webhook.arte7.cloud/webhook/datas-agendamento';

        const mapaCursos = {
            VIG: ["Formação", "Reciclagem", "Extensão", "Reteste", "Admissional"],
            PF: ["CR / CAC", "Porte / Posse", "GCM", "Reteste-CR", "Concurso"],
            Psicossocial: ["Admissional", "Concurso", "Periódico", "Perfil", "Empresarial", "Psicopedagógico", "Psicossocial"]
        };

        const elements = [
            'tipo', 'curso', 'celular', 'cpf', 'nome', 'empresa', 
            'nascimento', 'sexo', 'dataAgendamento', 'btn-enviar', 
            'btn-texto', 'btn-spinner', 'cpf-spinner', 'label-empresa', 'wrapper-empresa'
        ].reduce((acc, id) => ({ ...acc, [id]: document.getElementById(id) }), {});

        const form = document.getElementById('form-agendamento');

        function mostrarMensagem(texto, tipo) {
            const msg = document.createElement('div');
            msg.className = `mensagem ${tipo}`;
            msg.textContent = texto;
            document.body.appendChild(msg);
            setTimeout(() => {
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 300);
            }, 5000);
        }

        async function carregarDatas() {
            try {
                const resp = await fetch(DATAS_WEBHOOK_URL);
                if (!resp.ok) throw new Error();
                const datas = await resp.json();
                elements.dataAgendamento.innerHTML = '<option value="">Escolha uma data disponível...</option>';
                datas.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.value;
                    opt.textContent = item.label;
                    elements.dataAgendamento.appendChild(opt);
                });
            } catch (err) {
                elements.dataAgendamento.innerHTML = '<option value="">Erro ao carregar datas. Tente recarregar.</option>';
            }
        }

        elements.tipo.addEventListener('change', function() {
            elements.curso.innerHTML = '<option value="">Selecione o curso...</option>';
            if (!this.value || !mapaCursos[this.value]) return;
            mapaCursos[this.value].forEach(curso => {
                const opt = document.createElement('option');
                opt.value = curso;
                opt.textContent = curso;
                elements.curso.appendChild(opt);
            });
        });

        elements.cpf.addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 9) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
            else if (v.length > 6) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
            else if (v.length > 3) v = `${v.slice(0,3)}.${v.slice(3)}`;
            e.target.value = v;
        });

        elements.celular.addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '').slice(0,11);
            if (v.length >= 7) e.target.value = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
            else if (v.length > 2) e.target.value = `(${v.slice(0,2)}) ${v.slice(2)}`;
            else e.target.value = v;
        });

        const toUpper = e => e.target.value = e.target.value.toUpperCase();
        elements.nome.addEventListener('input', toUpper);
        elements.empresa.addEventListener('input', toUpper);

        // Automação para seleção de "Empresa" e Labels Dinâmicos
        function atualizarCamposEmpresa() {
            const tipoCliente = document.querySelector('input[name="tipoCliente"]:checked')?.value;
            const tipoServico = elements.tipo.value;
            
            // Garantir visibilidade (DETRAN removido)
            elements['wrapper-empresa'].style.display = 'block';

            // Regra de Label
            if (tipoCliente === 'empresa') {
                elements['label-empresa'].textContent = '🏢 Nome da Empresa';
            } else if (tipoCliente === 'particular') {
                if (tipoServico === 'VIG') {
                    elements['label-empresa'].textContent = '🏢 Nome da Academia / Escola de Vigilante';
                } else if (tipoServico === 'PF') {
                    elements['label-empresa'].textContent = '🏢 Nome do Clube de Tiro ou Despachante que indicou';
                } else {
                    elements['label-empresa'].textContent = '🏢 Nome da Empresa';
                }
            }
        }

        document.querySelectorAll('input[name="tipoCliente"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'empresa') {
                    elements.tipo.value = 'VIG';
                    elements.tipo.dispatchEvent(new Event('change'));
                    setTimeout(() => {
                        elements.curso.value = 'Reciclagem';
                    }, 50);
                }
                atualizarCamposEmpresa();
            });
        });

        elements.tipo.addEventListener('change', atualizarCamposEmpresa);

        async function buscarCPF(cpf) {
            const cleanCPF = cpf.replace(/\D/g, '');
            if (cleanCPF.length !== 11) return;
            elements['cpf-spinner'].style.display = 'inline-block';
            try {
                const resp = await fetch(`${CPF_PROXY_URL}?cpf=${cleanCPF}`);
                const dados = await resp.json();
                if (dados.nome) elements.nome.value = dados.nome.toUpperCase();
                if (dados.nascimento) elements.nascimento.value = dados.nascimento;
                if (dados.sexo) elements.sexo.value = dados.sexo;
            } catch (err) { console.error('Erro consulta CPF'); }
            finally { elements['cpf-spinner'].style.display = 'none'; }
        }

        elements.cpf.addEventListener('blur', () => buscarCPF(elements.cpf.value));

        form.addEventListener('submit', async e => {
            e.preventDefault();
            elements['btn-enviar'].disabled = true;
            elements['btn-texto'].textContent = 'Processando...';
            elements['btn-spinner'].style.display = 'inline-block';

            const payload = {
                dataAgendamento: elements.dataAgendamento.value,
                celular: elements.celular.value,
                cpf: elements.cpf.value,
                nome: elements.nome.value,
                tipoCliente: document.querySelector('input[name="tipoCliente"]:checked')?.value || '',
                tipo: elements.tipo.value,
                curso: elements.curso.value,
                empresa: elements.empresa.value,
                obs: document.getElementById('obs').value,
                nascimento: elements.nascimento.value,
                sexo: elements.sexo.value
            };

            try {
                const resp = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) throw new Error();
                mostrarMensagem('✅ Agendamento realizado com sucesso!', 'sucesso');
                form.reset();
                carregarDatas();
            } catch (err) {
                mostrarMensagem('❌ Erro de comunicação. Verifique a internet e tente novamente.', 'erro');
            } finally {
                elements['btn-enviar'].disabled = false;
                elements['btn-texto'].textContent = 'Confirmar Agendamento';
                elements['btn-spinner'].style.display = 'none';
            }
        });

        carregarDatas();
    </script>
</body>
</html>
