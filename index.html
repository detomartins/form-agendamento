<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agendamento Arte Equilíbrio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #fce4ff, #f3d1ff, #e2c4ff); }
    .card { background: #ffffff; width: 100%; max-width: 520px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); padding: 24px 20px 20px; }
    .titulo { text-align: center; margin-bottom: 20px; }
    .titulo h1 { font-size: 1.4rem; color: #b2185e; margin-bottom: 4px; }
    .titulo p { font-size: 0.85rem; color: #777; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: #444; margin-bottom: 2px; display: block; }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.95rem; }
    input.ok, select.ok { border-color: #7cb342; }
    input.error, select.error { border-color: #e57373; }
    .linha { display: flex; gap: 12px; }
    .linha > div { flex: 1; }
    .help { font-size: .8em; color: #777; margin-top: 4px; }
    .hidden { display: none; }
    button { margin-top: 10px; padding: 10px 16px; border-radius: 999px; border: none; background: linear-gradient(135deg, #d81b60, #8e24aa); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; opacity: .6; }
    button:enabled { opacity: 1; }
    .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #c2185b; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .campo-com-loading { position: relative; }
    .campo-loading { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
    @media (max-width:600px){ .linha{flex-direction:column;} }
  </style>
</head>
<body>
<div class="card">
  <div class="titulo">
    <h1>Agendamento Arte Equilíbrio</h1>
    <p>Preencha os dados do cliente para realizar o agendamento.</p>
  </div>

  <form id="form-agendamento">

    <div>
      <label for="dataAgendamento">Data Agendamento</label>
      <select id="dataAgendamento" required>
        <option value="">Carregando datas...</option>
      </select>
    </div>

    <div class="linha">
      <div>
        <label for="celular">Celular</label>
        <input type="tel" id="celular" placeholder="(11) 9 9999-9999">
      </div>
      <div class="campo-com-loading">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
        <div class="campo-loading"><div class="spinner" id="cpf-spinner"></div></div>
      </div>
    </div>

    <div>
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>
    </div>

    <div>
      <label for="tipoCliente">Tipo de cliente</label>
      <select id="tipoCliente" required>
        <option value="">Selecione o tipo de cliente</option>
        <option value="particular">Particular – faço por minha conta</option>
        <option value="empresa">Empresa – faço pela empresa</option>
        <option value="clube">Clube de Tiro – indicado pelo clube</option>
        <option value="despachante">Despachante Bélico – indicado pelo despachante</option>
      </select>
    </div>

    <div class="linha">
      <div>
        <label for="tipo">Tipo de Avaliação</label>
        <select id="tipo" required></select>
        <div id="helpTipo" class="help hidden">Definido automaticamente conforme o tipo de cliente.</div>
      </div>
      <div>
        <label for="curso">Curso</label>
        <select id="curso" required>
          <option value="">Selecione o curso</option>
        </select>
      </div>
    </div>

    <div>
      <label for="empresa" id="empresaLabel">Empresa</label>
      <input type="text" id="empresa" placeholder="Digite o nome da empresa">
    </div>

    <div>
      <label for="obs">Obs</label>
      <textarea id="obs" rows="3"></textarea>
    </div>

    <button type="submit" id="btnAgendar" disabled>Agendar</button>
  </form>
</div>

<script>
const CPF_API_URL_BASE = 'https://bk.elaidisparos.tech/consultar-filtrada/cpf';
const CPF_API_TOKEN = 'ybxgl1q14ooxirbe5i9eub';
const DATAS_WEBHOOK_URL = 'https://webhook.arte7.cloud/webhook/datas-agendamento';
const AGENDAMENTO_WEBHOOK_URL = 'https://webhook.arte7.cloud/webhook/agendamentoweb';

const mapaCursos = {
  VIG: ['Formação','Reciclagem','Extensão','Reteste','Admissional'],
  PF: ['CR / CAC / CRAF','Porte / Posse','GCM','Reteste-CR','Concurso'],
  Psicossocial: ['Admissional','Concurso','Periódico','Perfil','Empresarial','Psicopedagógico','Psicossocial'],
  // DETRAN: ['1º Habilitação','Renovação','Incluir EAD','Outros']
};

const tiposPorCliente = {
  particular: ['VIG','PF','Psicossocial'],
  empresa: ['VIG','Psicossocial'],
  clube: ['PF'],
  despachante: ['PF']
};

const labelsTipo = { VIG:'PF: Vigilante', PF:'PF: Arma de Fogo', Psicossocial:'Psicossocial', DETRAN:'DETRAN' };

const dataAgendamento = document.getElementById('dataAgendamento');
const celular = document.getElementById('celular');
const cpf = document.getElementById('cpf');
const nome = document.getElementById('nome');
const tipoCliente = document.getElementById('tipoCliente');
const tipo = document.getElementById('tipo');
const curso = document.getElementById('curso');
const empresa = document.getElementById('empresa');
const empresaLabel = document.getElementById('empresaLabel');
const helpTipo = document.getElementById('helpTipo');
const btn = document.getElementById('btnAgendar');
const cpfSpinner = document.getElementById('cpf-spinner');

async function carregarDatas(){
  try{
    const r = await fetch(DATAS_WEBHOOK_URL);
    const datas = await r.json();
    dataAgendamento.innerHTML = '<option value="">Selecione uma data</option>';
    datas.forEach(d => dataAgendamento.add(new Option(d.label,d.value)));
  }catch{ dataAgendamento.innerHTML = '<option value="">Erro ao carregar datas</option>'; }
}
carregarDatas();

celular.addEventListener('input', e => {
  const isBackspace = e.inputType === 'deleteContentBackward';
  let v = celular.value.replace(/\D/g,'').slice(0,11);

  if (isBackspace) {
    celular.value = v;
    return;
  }

  if(v.length >= 7)
    celular.value = `(${v.slice(0,2)}) ${v.slice(2,3)} ${v.slice(3,7)}-${v.slice(7)}`;
  else if(v.length > 2)
    celular.value = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else
    celular.value = v;
});



cpf.addEventListener('input',()=>{
  let v = cpf.value.replace(/\D/g,'').slice(0,11);
  if(v.length>9) cpf.value = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
  else if(v.length>6) cpf.value = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
  else if(v.length>3) cpf.value = `${v.slice(0,3)}.${v.slice(3)}`;
  else cpf.value = v;
});

function validarCPF(c){
  c=c.replace(/\D/g,'');
  if(c.length!==11||/(\d)\1{10}/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=c[i]*(10-i);
  let r=(s*10)%11; if(r==10)r=0; if(r!=c[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=c[i]*(11-i);
  r=(s*10)%11; if(r==10)r=0; return r==c[10];
}

cpf.addEventListener('blur',async()=>{
  if(!validarCPF(cpf.value)) return;
  cpfSpinner.style.display='block';
  try{
    const r = await fetch(`${CPF_API_URL_BASE}?cpf=${cpf.value.replace(/\D/g,'')}&token=${CPF_API_TOKEN}`);
    const d = await r.json();
    if(d?.nome) nome.value = d.nome.toUpperCase();
  }finally{ cpfSpinner.style.display='none'; validarFormulario(); }
});

function rebuildTipo(){
  const valorAtual = tipo.value;

  tipo.innerHTML = '<option value="">Selecione o tipo</option>';

  const lista = tiposPorCliente[tipoCliente.value] || [];
  lista.forEach(v => {
    tipo.add(new Option(labelsTipo[v], v));
  });

  // restaura seleção se ainda for válida
  if (lista.includes(valorAtual)) {
    tipo.value = valorAtual;
  }

  // força PF apenas para clube / despachante
  if (['clube','despachante'].includes(tipoCliente.value)) {
    tipo.value = 'PF';
    tipo.disabled = true;
  } else {
    tipo.disabled = false;
  }
}


function ajustarEmpresa(){
  empresa.disabled = false;
  empresa.value = '';
  empresaLabel.textContent = 'Empresa';
  empresa.placeholder = 'Digite o nome da empresa';

  // PARTICULAR + PF VIGILANTE
if (tipoCliente.value === 'particular' && tipo.value === 'VIG') {
  empresaLabel.textContent = 'Escola / Academia';
  empresa.placeholder = 'Digite o nome da escola ou academia';
  return;
}

  // PARTICULAR + PF VIGILANTE
if (tipoCliente.value === 'particular' && tipo.value === 'PF') {
  empresaLabel.textContent = 'Particular';
  empresa.placeholder = 'Particular';
  return;
}

  // CLUBE DE TIRO
  if (tipoCliente.value === 'clube') {
    empresaLabel.textContent = 'Clube de Tiro';
    empresa.placeholder = 'Digite o nome do clube de tiro';
    return;
  }

  // DESPACHANTE BÉLICO
  if (tipoCliente.value === 'despachante') {
    empresaLabel.textContent = 'Despachante Bélico';
    empresa.placeholder = 'Digite o nome do despachante bélico';
    return;
  }
}
tipoCliente.addEventListener('change', ajustarEmpresa);
tipo.addEventListener('change', ajustarEmpresa);


function carregarCursos(){
  curso.innerHTML='<option value="">Selecione o curso</option>';
  (mapaCursos[tipo.value]||[]).forEach(c=>curso.add(new Option(c,c)));
}

function validarFormulario(){
  let ok=true;
  function check(el, cond){ el.classList.remove('ok','error'); if(!cond){ el.classList.add('error'); ok=false; } else el.classList.add('ok'); }

  check(cpf, validarCPF(cpf.value));
  check(nome, nome.value.trim()!=='');
  check(dataAgendamento, dataAgendamento.value!=='');
  check(tipo, tipo.value!=='');
  check(curso, curso.value!=='');

  btn.disabled=!ok;
}

[tipoCliente,tipo,curso,nome,cpf,dataAgendamento].forEach(el=>el.addEventListener('change',()=>{ validarFormulario(); }));

[tipoCliente,tipo].forEach(el=>el.addEventListener('change',()=>{ rebuildTipo(); ajustarEmpresa(); carregarCursos(); validarFormulario(); }));

const form = document.getElementById('form-agendamento');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  btn.disabled = true;
  btn.textContent = 'Agendando...';

  const payload = {
    dataAgendamento: dataAgendamento.value,
    celular: celular.value,
    cpf: cpf.value.replace(/\D/g,''),
    nome: nome.value,
    tipoCliente: tipoCliente.value,
    tipoAvaliacao: tipo.value,
    curso: curso.value,
    empresa: empresa.value,
    obs: obs.value
  };

  try {
    const r = await fetch(AGENDAMENTO_WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!r.ok) throw new Error('Erro ao enviar agendamento');

    // ✅ MENSAGEM DE SUCESSO
    alert('✅ Agendamento realizado com sucesso!\n');

    form.reset();
    btn.textContent = 'Agendar';
    btn.disabled = true;

  } catch (err) {
    console.error(err);
    alert('❌ Erro ao realizar o agendamento. Tente novamente ou entre em contato.');
    btn.textContent = 'Agendar';
    btn.disabled = false;
  }
});

</script>
</body>
</html>
